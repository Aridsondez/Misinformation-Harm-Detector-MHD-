version: "3.9"

services:
  backend:
    build: ./backend
    container_name: mhd-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: mhd-db
    environment:
      POSTGRES_USER: mhduser
      POSTGRES_PASSWORD: mhdpass
      POSTGRES_DB: mhd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
